<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoChainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="logoRingGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="whiteCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- White Squircle Badge -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#whiteCardGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Outer Orbit Arc -->
  <path d="M 50 16 A 34 34 0 1 0 84 50" stroke="url(#logoRingGrad)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Orbit Accent Dot -->
  <circle cx="81.5" cy="30.5" r="3.2" fill="#00E5FF" />

  <!-- Connected Link Group rotated 45 deg -->
  <g transform="rotate(45 50 50)">
    <rect x="41" y="22" width="18" height="32" rx="9" stroke="url(#logoChainGrad)" stroke-width="5.5" fill="none" stroke-linecap="round" />
    <rect x="41" y="46" width="18" height="32" rx="9" fill="url(#logoChainGrad)" stroke="none" />
    <circle cx="50" cy="56" r="4" fill="#FFFFFF" />
  </g>
</svg>
