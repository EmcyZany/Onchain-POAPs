<svg viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="#050505" />
  
  <!-- Header Bar -->
  <rect width="1080" height="160" fill="#0D0E12" />
  <circle cx="100" cy="80" r="32" fill="#0052FF" />
  <text x="160" y="92" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Create New POAP</text>

  <!-- Form Container -->
  <rect x="80" y="220" width="920" height="1560" rx="36" fill="#0E1015" stroke="#262A36" stroke-width="2" />

  <!-- Form Fields -->
  <text x="140" y="320" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">EVENT NAME</text>
  <rect x="140" y="350" width="800" height="80" rx="16" fill="#161922" stroke="#2A3042" stroke-width="1.5" />
  <text x="170" y="400" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28">Base Camp Tokyo 2026</text>

  <text x="140" y="490" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">DESCRIPTION</text>
  <rect x="140" y="520" width="800" height="140" rx="16" fill="#161922" stroke="#2A3042" stroke-width="1.5" />
  <text x="170" y="575" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="26">Official badge for Tokyo builders hackathon</text>

  <!-- Distribution Mechanism Options -->
  <text x="140" y="730" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">DISTRIBUTION MODE</text>
  <rect x="140" y="760" width="250" height="100" rx="18" fill="#0052FF" fill-opacity="0.15" stroke="#0052FF" stroke-width="2" />
  <text x="265" y="820" text-anchor="middle" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Public Mint</text>

  <rect x="415" y="760" width="250" height="100" rx="18" fill="#161922" stroke="#2A3042" stroke-width="1.5" />
  <text x="540" y="820" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="24" font-weight="600">Merkle Tree</text>

  <rect x="690" y="760" width="250" height="100" rx="18" fill="#161922" stroke="#2A3042" stroke-width="1.5" />
  <text x="815" y="820" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="24" font-weight="600">ECDSA Sign</text>

  <!-- SVG Artwork Generator Panel -->
  <text x="140" y="930" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">BADGE VISUAL DESIGN</text>
  <rect x="140" y="960" width="800" height="360" rx="20" fill="#141824" stroke="#2A334A" stroke-width="1.5" />
  <circle cx="540" cy="1140" r="100" fill="#0052FF" fill-opacity="0.3" />
  <circle cx="540" cy="1140" r="70" stroke="#0052FF" stroke-width="8" />

  <!-- Submit Button -->
  <rect x="140" y="1560" width="800" height="100" rx="24" fill="#0052FF" />
  <text x="540" y="1622" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Deploy POAP onchain</text>
</svg>
