<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#08090C" />
  
  <defs>
    <!-- Radial Background Glows -->
    <radialGradient id="heroGlow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="heroChainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="heroRingGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="badgeWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="heroCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0052FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <rect width="1200" height="630" fill="url(#heroGlow1)" />
  <rect width="1200" height="630" fill="url(#heroGlow2)" />

  <!-- Grid lines pattern overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left: Brand Lockup and Typography -->
  <!-- Network Pill -->
  <g transform="translate(100, 110)">
    <rect width="210" height="36" rx="18" fill="#0052FF" fill-opacity="0.15" stroke="#0052FF" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#0052FF" />
    <text x="35" y="23" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">BUILT ON BASE SEPOLIA</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">Onchain POAP Protocol</text>
  <text x="100" y="275" fill="url(#heroTextGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Proof of Attendance for Farcaster</text>

  <!-- Subtitle -->
  <text x="100" y="340" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    <tspan x="100" dy="0">Mint, distribute, and collect verifiable cryptographic attendance badges.</tspan>
    <tspan x="100" dy="30">Native Merkle allowlists, ECDSA signatures &amp; zero-cost gas on Base.</tspan>
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#16181D" stroke="#262A36" stroke-width="1.5" />
    <text x="20" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡️ Instant Mint</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="42" rx="10" fill="#16181D" stroke="#262A36" stroke-width="1.5" />
    <text x="195" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🟣 Farcaster Mini App</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="170" height="42" rx="10" fill="#16181D" stroke="#262A36" stroke-width="1.5" />
    <text x="390" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🔐 Merkle Trees</text>
  </g>

  <!-- Right: Big Iconic Brand Logo Badge -->
  <g transform="translate(780, 140)" filter="url(#heroCardShadow)">
    <rect width="320" height="320" rx="90" fill="url(#badgeWhiteGrad)" stroke="#E2E8F0" stroke-width="3" />
    
    <!-- Outer Orbit Ring -->
    <path d="M 160 50 A 110 110 0 1 0 270 160" stroke="url(#heroRingGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Accent Dot -->
    <circle cx="262" cy="98" r="10" fill="#00E5FF" />

    <!-- Chain Links -->
    <g transform="rotate(45 160 160)">
      <rect x="132" y="68" width="56" height="102" rx="28" stroke="url(#heroChainGrad)" stroke-width="18" fill="none" stroke-linecap="round" />
      <rect x="132" y="148" width="56" height="102" rx="28" fill="url(#heroChainGrad)" stroke="none" />
      <circle cx="160" cy="180" r="12" fill="#FFFFFF" />
    </g>
  </g>
</svg>
