<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Onchain POAPs — Protocol on Base Sepolia</title>
    <meta name="description" content="Production-ready decentralized POAP protocol on Base Sepolia. Register events, manage allowlists, generate cryptographic signatures, and collect onchain proof-of-attendance tokens as a standalone app and Farcaster Mini App." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Onchain POAPs" />
    <meta property="og:description" content="Production-ready decentralized POAP protocol on Base Sepolia. Register events, manage allowlists, generate cryptographic signatures, and collect onchain proof-of-attendance tokens as a standalone app and Farcaster Mini App." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://onchain-poaps-nu.vercel.app/hero-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Onchain POAPs" />
    <meta name="twitter:description" content="Production-ready decentralized POAP protocol on Base Sepolia. Register events, manage allowlists, generate cryptographic signatures, and collect onchain proof-of-attendance tokens as a standalone app and Farcaster Mini App." />
    <meta name="twitter:image" content="https://onchain-poaps-nu.vercel.app/hero-preview.png" />
    
    <!-- Farcaster Mini App (Frames v2) Metadata -->
    <meta
      name="fc:frame"
      content='{"version":"next","imageUrl":"https://onchain-poaps-nu.vercel.app/hero-preview.png","button":{"title":"Launch app","action":{"type":"launch_frame","name":"Onchain POAPs","url":"https://onchain-poaps-nu.vercel.app","splashImageUrl":"https://onchain-poaps-nu.vercel.app/icon.png","splashBackgroundColor":"#050505"}}}'
    />

    <script>
      // Early notify parent iframe if running in Farcaster Mini App context
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'ready' }, '*');
          window.parent.postMessage({ type: 'fc:frame:ready' }, '*');
          window.parent.postMessage({ type: 'fc:miniapp:ready' }, '*');
        }
      } catch (e) {}
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050505] text-white antialiased selection:bg-[#0052FF] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
